<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team – BetterBookie</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .team-wrap { padding: 1.5rem 2rem 3rem; max-width: 1100px; margin: 0 auto; }
      .team-hero { display: flex; align-items: center; gap: 1.2rem; padding: 1.25rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; margin-bottom: 1.5rem; }
      .team-hero img.team-logo { width: 88px; height: 88px; object-fit: contain; flex-shrink: 0; }
      .team-hero .team-meta h2 { margin: 0 0 0.3rem; font-size: 1.5rem; }
      .team-hero .team-meta .sub { font-size: 0.85rem; opacity: 0.65; }
      .team-hero .team-meta .record { display: inline-block; margin-top: 0.5rem; padding: 0.25rem 0.7rem; background: rgba(255,255,255,0.08); border-radius: 4px; font-size: 0.85rem; font-weight: 600; }
      .status { text-align: center; padding: 2.5rem 1rem; opacity: 0.7; }
      .columns { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
      @media (min-width: 800px) { .columns { grid-template-columns: 1fr 1fr; } }
      .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 1rem 1.1rem; }
      .panel-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.6; margin: 0 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
      .game-row { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; padding: 0.45rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.88rem; }
      .game-row:last-child { border-bottom: none; }
      .game-row .gr-opponent { flex: 1; display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
      .game-row .gr-opponent img { width: 20px; height: 20px; object-fit: contain; }
      .game-row .gr-opponent .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .game-row .gr-result { font-variant-numeric: tabular-nums; font-weight: 600; }
      .game-row .gr-win { color: #6bcb77; }
      .game-row .gr-loss { color: #ff6b6b; }
      .game-row .gr-tie { color: #ffd93d; }
      .game-row .gr-date { font-size: 0.78rem; opacity: 0.55; }
      .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.6rem; max-height: 480px; overflow-y: auto; }
      .player-row { display: flex; align-items: center; gap: 0.45rem; padding: 0.35rem 0; font-size: 0.84rem; }
      .player-row img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,0.05); flex-shrink: 0; }
      .player-row .pos { font-size: 0.7rem; opacity: 0.55; margin-left: 0.3rem; }
      .nav-dropdown { position: relative; display: inline-block; }
      .nav-dropdown-btn { background: transparent; border: none; color: inherit; cursor: pointer; font-size: 1rem; padding: 0; font-family: inherit; }
      .nav-dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; min-width: 200px; z-index: 100; padding: 0.5rem 0; }
      .nav-dropdown.open .nav-dropdown-menu { display: block; }
      .nav-dropdown-menu a { display: block; padding: 0.6rem 1rem; color: inherit; text-decoration: none; font-size: 0.9rem; opacity: 0.8; }
      .nav-dropdown-menu a:hover { opacity: 1; background: rgba(255,255,255,0.05); }
      .nav-dropdown-menu .menu-divider { border-top: 1px solid rgba(255,255,255,0.1); margin: 0.25rem 0; }
      .nav-dropdown-menu .menu-label { padding: 0.4rem 1rem 0.1rem; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.4; display: block; }
    </style>
  </head>
  <body>
    <header class="hero" style="min-height:auto;padding-bottom:1rem;">
      <nav class="nav">
        <h1 class="logo"><a href="index.html" style="text-decoration:none;color:inherit;">BetterBookie</a></h1>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">☰</button>
        <div class="nav-links" id="nav-links">
          <a href="index.html#features">Features</a>
          <a href="scores.html">Scores</a>
          <a href="schedule.html">Schedule</a>
          <a href="odds.html">Live Odds</a>
          <a href="injuries.html">Injuries</a>
          <a href="matchups.html">Matchups</a>
          <a href="standings.html">Standings</a>
          <a href="leaders.html">Leaders</a>
          <a href="news.html">News</a>
          <a href="bets.html">My Bets</a>
          <a href="dashboard.html">Dashboard</a>
          <div class="nav-dropdown" id="nav-settings-dropdown">
            <button class="nav-dropdown-btn" onclick="document.getElementById('nav-settings-dropdown').classList.toggle('open')">Settings ▾</button>
            <div class="nav-dropdown-menu">
              <span class="menu-label">Preferences</span>
              <a href="settings.html">All Preferences</a>
              <a href="settings.html#sports">Sports Preferences</a>
              <a href="settings.html#teams">Team Preferences</a>
              <a href="settings.html#gambling">Gambling Preferences</a>
              <a href="settings.html#fantasy">Fantasy Preferences</a>
              <div class="menu-divider"></div>
              <a href="#" id="nav-signout">Logout</a>
            </div>
          </div>
          <a href="login.html" id="nav-login">Login</a>
        </div>
      </nav>
    </header>

    <section class="team-wrap" id="team-wrap">
      <div class="status" id="team-status">Loading team…</div>
    </section>

    <footer class="footer">
      <p>&copy; 2026 BetterBookie. Built by a beginner.</p>
    </footer>

    <script src="script.js"></script>
    <script>
      const VERCEL = 'https://better-bookie-five.vercel.app';
      const PRO_SPORTS = new Set(['nfl', 'nba', 'mlb', 'nhl']);

      function getParams() {
        const u = new URLSearchParams(window.location.search);
        return { sport: u.get('sport'), id: u.get('id') };
      }

      function gameOutcome(game, teamId) {
        const comp = game.competitions?.[0];
        const us = (comp?.competitors ?? []).find(c => String(c.id) === String(teamId));
        const them = (comp?.competitors ?? []).find(c => String(c.id) !== String(teamId));
        if (!us || !them) return null;
        const usScore = us.score != null ? Number(us.score) : null;
        const themScore = them.score != null ? Number(them.score) : null;
        const completed = comp?.status?.type?.completed === true;
        return {
          opponent: them,
          isHome: us.homeAway === 'home',
          usScore, themScore, completed,
          date: game.date,
        };
      }

      function gameRow(game, teamId) {
        const o = gameOutcome(game, teamId);
        if (!o) return '';
        const oppName = o.opponent?.team?.displayName ?? o.opponent?.team?.name ?? 'TBD';
        const oppLogo = o.opponent?.team?.logos?.[0]?.href ?? o.opponent?.team?.logo ?? '';
        const prefix = o.isHome ? 'vs' : '@';
        const dateStr = o.date ? new Date(o.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
        let right = '';
        if (o.completed && o.usScore != null && o.themScore != null) {
          const wlt = o.usScore > o.themScore ? 'W' : o.usScore < o.themScore ? 'L' : 'T';
          const cls = wlt === 'W' ? 'gr-win' : wlt === 'L' ? 'gr-loss' : 'gr-tie';
          right = `<span class="gr-result ${cls}">${wlt} ${o.usScore}-${o.themScore}</span>`;
        } else {
          const t = o.date ? new Date(o.date).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '';
          right = `<span class="gr-date">${dateStr}${t ? ' · ' + t : ''}</span>`;
        }
        return `
          <div class="game-row">
            <div class="gr-opponent">
              <span style="opacity:0.5;font-size:0.78rem;">${prefix}</span>
              ${oppLogo ? `<img src="${oppLogo}" alt="${oppName}" onerror="this.style.display='none'">` : ''}
              <span class="name">${oppName}</span>
            </div>
            ${right}
          </div>
        `;
      }

      function renderTeam(data, sport) {
        const wrap = document.getElementById('team-wrap');
        const team = data?.info?.team ?? {};
        const name = team.displayName ?? team.name ?? 'Team';
        const logo = team.logos?.[0]?.href ?? team.logo ?? '';
        const recordSummary = team.record?.items?.[0]?.summary
          ?? data?.info?.team?.standingSummary
          ?? '';
        const conferenceName = team.groups?.parent?.name ?? team.groups?.name ?? '';
        document.title = `${name} – BetterBookie`;

        // Sort schedule by date.
        const events = (data?.schedule?.events ?? []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
        const now = Date.now();
        const past = events.filter(e => new Date(e.date).getTime() < now || e.competitions?.[0]?.status?.type?.completed);
        const future = events.filter(e => !past.includes(e));
        const recent = past.slice(-5).reverse();
        const upcoming = future.slice(0, 5);

        const recentHtml = recent.length
          ? recent.map(g => gameRow(g, team.id)).join('')
          : '<div style="opacity:0.6;font-size:0.85rem;padding:0.5rem 0;">No recent games.</div>';
        const upcomingHtml = upcoming.length
          ? upcoming.map(g => gameRow(g, team.id)).join('')
          : '<div style="opacity:0.6;font-size:0.85rem;padding:0.5rem 0;">No upcoming games scheduled.</div>';

        const rosterAthletes = flattenRoster(data?.roster);
        const rosterHtml = rosterAthletes.length
          ? rosterAthletes.slice(0, 60).map(a => {
              const headshot = a.headshot?.href ?? '';
              const pName = a.displayName ?? a.fullName ?? '—';
              const pos = a.position?.abbreviation ?? a.position?.displayName ?? '';
              const playerLink = a.id ? `player.html?sport=${sport}&id=${a.id}` : '';
              const nameNode = playerLink
                ? `<a href="${playerLink}" style="color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">${pName}</a>`
                : `<span class="name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">${pName}</span>`;
              return `
                <div class="player-row">
                  ${headshot ? `<img src="${headshot}" alt="${pName}" onerror="this.style.background='rgba(255,255,255,0.08)';this.src='';">` : '<div style="width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,0.05);"></div>'}
                  ${nameNode}
                  ${pos ? `<span class="pos">${pos}</span>` : ''}
                </div>
              `;
            }).join('')
          : '<div style="opacity:0.6;font-size:0.85rem;padding:0.5rem 0;">Roster not available.</div>';

        const matchupCta = PRO_SPORTS.has(sport)
          ? `<a href="matchups.html?sport=${sport}&home=${encodeURIComponent(name)}" style="color:inherit;opacity:0.75;font-size:0.85rem;text-decoration:none;border-bottom:1px dotted rgba(255,255,255,0.3);">🆚 Compare ${name} against another team →</a>`
          : '';

        wrap.innerHTML = `
          <div class="team-hero">
            ${logo ? `<img class="team-logo" src="${logo}" alt="${name}" onerror="this.style.display='none'">` : ''}
            <div class="team-meta">
              <h2>${name}</h2>
              <div class="sub">${conferenceName ? conferenceName + ' · ' : ''}${sport.toUpperCase()}</div>
              ${recordSummary ? `<div class="record">${recordSummary}</div>` : ''}
              <div style="margin-top:0.6rem;">${matchupCta}</div>
            </div>
          </div>

          <div class="columns">
            <div class="panel">
              <h3 class="panel-title">Last 5 Games</h3>
              ${recentHtml}
            </div>
            <div class="panel">
              <h3 class="panel-title">Next 5 Games</h3>
              ${upcomingHtml}
            </div>
          </div>

          <div class="panel" style="margin-top:1.5rem;">
            <h3 class="panel-title">Roster (${rosterAthletes.length})</h3>
            <div class="roster-grid">${rosterHtml}</div>
          </div>
        `;
      }

      // ESPN's roster shape differs slightly between sports. Sometimes the athletes
      // sit directly under data.athletes; for grouped sports (e.g., NFL by position),
      // they're nested under data.athletes[].items.
      function flattenRoster(roster) {
        if (!roster) return [];
        const a = roster.athletes;
        if (!Array.isArray(a)) return [];
        if (a.length && a[0]?.items) return a.flatMap(g => g.items ?? []);
        return a;
      }

      async function loadTeam() {
        const status = document.getElementById('team-status');
        const { sport, id } = getParams();
        if (!sport || !id) {
          status.innerHTML = 'Open a team from <a href="standings.html" style="color:inherit;text-decoration:underline;">standings</a> to see their detail page.';
          return;
        }
        try {
          const r = await fetch(`${VERCEL}/api/espn-team?sport=${sport}&id=${id}`);
          const data = await r.json();
          if (data?.error) {
            status.textContent = data.error;
            return;
          }
          renderTeam(data, sport);
        } catch {
          status.textContent = 'Failed to load team.';
        }
      }

      loadTeam();
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

      const app = initializeApp({
        apiKey: "AIzaSyC2sgfkqCVFU1RfiWsArIWjpvpebKVxT64",
        authDomain: "betterbookie.firebaseapp.com",
        projectId: "betterbookie",
        storageBucket: "betterbookie.firebasestorage.app",
        messagingSenderId: "995577929895",
        appId: "1:995577929895:web:303a93aa15628d6c503b82"
      });
      const auth = getAuth(app);

      onAuthStateChanged(auth, user => {
        const loginLink = document.getElementById('nav-login');
        if (loginLink) loginLink.style.display = user ? 'none' : 'inline';
      });

      document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('nav-settings-dropdown');
        if (dropdown && !dropdown.contains(e.target)) dropdown.classList.remove('open');
      });

      document.getElementById('nav-signout')?.addEventListener('click', async (e) => {
        e.preventDefault();
        await signOut(auth);
        window.location.href = 'login.html';
      });
    </script>
  </body>
</html>
