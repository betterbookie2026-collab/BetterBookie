<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – BetterBookie</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .login-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 3rem 1rem;
      }
      .login-box {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        padding: 2.5rem;
        width: 100%;
        max-width: 420px;
      }
      .login-box h3 {
        margin: 0 0 1.5rem;
        font-size: 1.4rem;
        text-align: center;
      }
      .login-box input {
        width: 100%;
        padding: 0.65rem 1rem;
        margin-bottom: 1rem;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.05);
        color: inherit;
        font-size: 0.95rem;
        box-sizing: border-box;
      }
      .login-box button {
        width: 100%;
        padding: 0.65rem;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 0.95rem;
        margin-bottom: 0.75rem;
      }
      .btn-email {
        background: #fff;
        color: #000;
        font-weight: 600;
      }
      .btn-google {
        background: transparent;
        border: 2px solid rgba(255,255,255,0.3) !important;
        color: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .divider {
        text-align: center;
        opacity: 0.4;
        margin: 1rem 0;
        font-size: 0.85rem;
      }
      .toggle-link {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.85rem;
        opacity: 0.7;
      }
      .toggle-link a {
        color: inherit;
        cursor: pointer;
        text-decoration: underline;
      }
      .error-msg {
        color: #ff6b6b;
        font-size: 0.85rem;
        margin-bottom: 0.75rem;
        text-align: center;
        display: none;
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <nav class="nav">
        <h1 class="logo"><a href="index.html" style="text-decoration:none;color:inherit;">BetterBookie</a></h1>
        <button
          class="menu-toggle"
          id="menu-toggle"
          type="button"
          aria-label="Toggle menu"
          aria-expanded="false"
        >
          ☰
        </button>
        <div class="nav-links" id="nav-links">
          <a href="index.html#features">Features</a>
          <a href="scores.html">Scores</a>
          <a href="odds.html">Live Odds</a>
          <a href="injuries.html">Injuries</a>
          <a href="index.html#signup" class="btn btn-small">Get Started</a>
        </div>
      </nav>
      <div class="hero-content">
        <h2 id="form-title">Welcome Back</h2>
        <p id="form-subtitle">Sign in to access your BetterBookie dashboard.</p>
      </div>
    </header>

    <section class="features">
      <div class="login-wrap">
        <div class="login-box">
          <h3 id="box-title">Sign In</h3>
          <p class="error-msg" id="error-msg"></p>

          <input type="email" id="email" placeholder="Email address" />
          <input type="password" id="password" placeholder="Password" />

          <button class="btn-email" id="email-btn">Sign In</button>

          <div class="divider">or</div>

          <button class="btn-google" id="google-btn">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.8 13.5-4.7l-6.2-5.2C29.4 35.6 26.8 36 24 36c-5.2 0-9.7-2.9-11.3-7H6.1C9.4 38.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.8l6.2 5.2C41 35.5 44 30.1 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
            Continue with Google
          </button>

          <div class="toggle-link">
            <span id="toggle-text">Don't have an account?</span>
            <a id="toggle-btn"> Sign Up</a>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>&copy; 2026 BetterBookie. Built by a beginner.</p>
    </footer>

    <script src="script.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC2sgfkqCVFU1RfiWsArIWjpvpebKVxT64",
        authDomain: "betterbookie.firebaseapp.com",
        projectId: "betterbookie",
        storageBucket: "betterbookie.firebasestorage.app",
        messagingSenderId: "995577929895",
        appId: "1:995577929895:web:303a93aa15628d6c503b82"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      let isSignUp = false;

      // Redirect if already logged in
      onAuthStateChanged(auth, user => {
        if (user) window.location.href = 'dashboard.html';
      });

      // Toggle between sign in and sign up
      document.getElementById('toggle-btn').addEventListener('click', () => {
        isSignUp = !isSignUp;
        document.getElementById('box-title').textContent = isSignUp ? 'Create Account' : 'Sign In';
        document.getElementById('form-title').textContent = isSignUp ? 'Create Your Account' : 'Welcome Back';
        document.getElementById('form-subtitle').textContent = isSignUp ? 'Sign up to set your BetterBookie preferences.' : 'Sign in to access your BetterBookie dashboard.';
        document.getElementById('email-btn').textContent = isSignUp ? 'Create Account' : 'Sign In';
        document.getElementById('toggle-text').textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
        document.getElementById('toggle-btn').textContent = isSignUp ? ' Sign In' : ' Sign Up';
      });

      function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.style.display = 'block';
      }

      // Email/password
      document.getElementById('email-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
          if (isSignUp) {
            await createUserWithEmailAndPassword(auth, email, password);
          } else {
            await signInWithEmailAndPassword(auth, email, password);
          }
          window.location.href = 'dashboard.html';
        } catch (err) {
          showError(err.message.replace('Firebase: ', ''));
        }
      });

      // Google
      document.getElementById('google-btn').addEventListener('click', async () => {
        try {
          await signInWithPopup(auth, provider);
          window.location.href = 'dashboard.html';
        } catch (err) {
          showError(err.message.replace('Firebase: ', ''));
        }
      });
    </script>
  </body>
</html>
