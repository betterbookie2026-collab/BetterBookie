    <style>
      .dashboard-wrap {
        padding: 2rem;
        max-width: 900px;
        margin: 0 auto;
      }
      .dashboard-wrap h3 {
        margin-bottom: 0.5rem;
      }
      .user-info {
        opacity: 0.6;
        font-size: 0.9rem;
        margin-bottom: 2rem;
      }
      .pref-section {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .pref-section h4 {
        margin: 0 0 1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.7;
        font-size: 0.8rem;
      }
      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 0.5rem;
      }
      .checkbox-grid label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
        cursor: pointer;
        padding: 0.4rem 0.5rem;
        border-radius: 4px;
        transition: background 0.15s;
      }
      .checkbox-grid label:hover {
        background: rgba(255,255,255,0.08);
      }
      .checkbox-grid input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .team-logo {
        width: 24px;
        height: 24px;
        object-fit: contain;
        flex-shrink: 0;
      }
      .save-btn {
        padding: 0.65rem 2rem;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 4px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 1rem;
      }
      .save-btn:hover { opacity: 0.9; }
      .signout-btn {
        padding: 0.5rem 1.25rem;
        background: transparent;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 4px;
        color: inherit;
        cursor: pointer;
        font-size: 0.85rem;
        margin-top: 1rem;
      }
      .success-msg {
        color: #6bcb77;
        font-size: 0.85rem;
        margin-top: 0.5rem;
        display: none;
      }

      // Build team checkboxes with logos
      function buildTeamGrid(containerId, teams) {
        const container = document.getElementById(containerId);
        container.innerHTML = teams.map(t => `
          <label>
            <input type="checkbox" value="${t.name}" />
            <img src="${t.logo}" class="team-logo" alt="${t.name}" onerror="this.style.display='none'" />
            ${t.name}
          </label>
        `).join('');
      }

      buildTeamGrid('nfl-teams', teamData.nfl);
      buildTeamGrid('nba-teams', teamData.nba);
      buildTeamGrid('mlb-teams', teamData.mlb);
      buildTeamGrid('nhl-teams', teamData.nhl);

      let currentUser = null;

      onAuthStateChanged(auth, async user => {
        if (!user) {
          window.location.href = 'login.html';
          return;
        }
        currentUser = user;
        document.getElementById('welcome-msg').textContent = `Welcome, ${user.displayName || user.email}!`;
        document.getElementById('user-email').textContent = user.email;

        const docRef = doc(db, 'users', user.uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const prefs = docSnap.data();
          if (prefs.sports) {
            prefs.sports.forEach(val => {
              const cb = document.querySelector(`input[value="${val}"]`);
              if (cb) cb.checked = true;
            });
          }
          if (prefs.teams) {
            prefs.teams.forEach(val => {
              const cb = document.querySelector(`input[value="${val}"]`);
              if (cb) cb.checked = true;
            });
          }
        }
      });

      document.getElementById('save-btn').addEventListener('click', async () => {
        if (!currentUser) return;

        const sports = [...document.querySelectorAll('.pref-section:first-of-type input:checked')].map(cb => cb.value);
        const teams = [...document.querySelectorAll('.pref-section:not(:first-of-type) input:checked')].map(cb => cb.value);

        await setDoc(doc(db, 'users', currentUser.uid), { sports, teams });

        const msg = document.getElementById('success-msg');
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 3000);
      });

      document.getElementById('signout-btn').addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = 'index.html';
      });
