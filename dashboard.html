<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – BetterBookie</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .dashboard-wrap {
        padding: 2rem;
        max-width: 900px;
        margin: 0 auto;
      }
      .dashboard-wrap h3 { margin-bottom: 0.5rem; }
      .user-info {
        opacity: 0.6;
        font-size: 0.9rem;
        margin-bottom: 2rem;
      }
      .pref-section {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .pref-section h4 {
        margin: 0 0 1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.7;
        font-size: 0.8rem;
      }
      .search-wrap { margin-bottom: 1.5rem; }
      .search-wrap input {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        border: 2px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.05);
        color: inherit;
        font-size: 0.95rem;
        box-sizing: border-box;
      }
      .search-wrap input:focus {
        outline: none;
        border-color: rgba(255,255,255,0.5);
      }
      .search-results {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        padding: 1rem 1.5rem;
        margin-bottom: 1.5rem;
        display: none;
      }
      .search-results h4 {
        margin: 0 0 1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.7;
        font-size: 0.8rem;
      }
      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 0.5rem;
      }
      .checkbox-grid label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
        cursor: pointer;
        padding: 0.4rem 0.5rem;
        border-radius: 4px;
        transition: background 0.15s;
      }
      .checkbox-grid label:hover { background: rgba(255,255,255,0.08); }
      .checkbox-grid input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .team-logo {
        width: 24px;
        height: 24px;
        object-fit: contain;
        flex-shrink: 0;
      }
      .sport-emoji { font-size: 1.1rem; flex-shrink: 0; }
      .sport-tag {
        font-size: 0.7rem;
        opacity: 0.5;
        margin-left: auto;
        padding-right: 0.25rem;
      }
      .team-nickname {
        font-size: 0.75rem;
        opacity: 0.45;
        margin-left: 0.1rem;
      }
      .no-results {
        opacity: 0.5;
        font-size: 0.9rem;
        padding: 0.5rem;
      }
      .conference-filter {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
        grid-column: 1/-1;
      }
      .conf-btn {
        padding: 0.3rem 0.75rem;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 20px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 0.8rem;
        transition: background 0.15s;
      }
      .conf-btn:hover { background: rgba(255,255,255,0.1); }
      .conf-btn.active {
        background: #fff;
        color: #000;
        border-color: #fff;
      }
      .show-more-wrap {
        grid-column: 1/-1;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(255,255,255,0.1);
      }
      .show-more-btn {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 4px;
        color: inherit;
        padding: 0.4rem 1rem;
        cursor: pointer;
        font-size: 0.85rem;
        margin-bottom: 0.75rem;
      }
      .show-more-btn:hover { background: rgba(255,255,255,0.08); }
      .extra-teams {
        display: none;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      .extra-teams label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
        cursor: pointer;
        padding: 0.4rem 0.5rem;
        border-radius: 4px;
        transition: background 0.15s;
      }
      .extra-teams label:hover { background: rgba(255,255,255,0.08); }
      .extra-teams input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .other-sports-wrap {
        margin-top: 2rem;
      }
      .other-sports-toggle {
        width: 100%;
        padding: 0.75rem 1.5rem;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        color: inherit;
        cursor: pointer;
        font-size: 0.95rem;
        text-align: left;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .other-sports-toggle:hover { background: rgba(255,255,255,0.08); }
      .other-sports-content { display: none; }
      .save-btn {
        padding: 0.65rem 2rem;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 4px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 1rem;
      }
      .save-btn:hover { opacity: 0.9; }
      .signout-btn {
        padding: 0.5rem 1.25rem;
        background: transparent;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 4px;
        color: inherit;
        cursor: pointer;
        font-size: 0.85rem;
        margin-top: 1rem;
      }
      .success-msg {
        color: #6bcb77;
        font-size: 0.85rem;
        margin-top: 0.5rem;
        display: none;
      }
      .loading-teams {
        opacity: 0.5;
        font-size: 0.85rem;
        padding: 0.5rem;
      }
    </style>
  </head>

            <label><input type="checkbox" value="ncaasoftball" /><span class="sport-emoji">🥎</span> College Softball</label>
          </div>

        <!-- Favorite sport team sections (shown when sport is selected) -->
        <div id="favorite-sport-sections"></div>

        <!-- Other sports section -->
        <div class="other-sports-wrap" id="other-sports-wrap" style="display:none;">
          <button class="other-sports-toggle" id="other-sports-toggle">

    <script src="script.js"></script>
    <script type="module">

      const sportMeta = {

      const nicknames = {
        'chiefs': 'Kansas City Chiefs', 'pats': 'New England Patriots',
        'patriots': 'New England Patriots', 'cowboys': 'Dallas Cowboys',
        'eagles': 'Philadelphia Eagles', 'niners': 'San Francisco 49ers',

        'chargers': 'Los Angeles Chargers', 'bills': 'Buffalo Bills',
        'dolphins': 'Miami Dolphins', 'jets': 'New York Jets',
        'giants': 'New York Giants', 'commanders': 'Washington Commanders',
        'bears': 'Chicago Bears', 'packers': 'Green Bay Packers',
        'vikings': 'Minnesota Vikings', 'lions': 'Detroit Lions',
        'falcons': 'Atlanta Falcons', 'saints': 'New Orleans Saints',
        'bucs': 'Tampa Bay Buccaneers', 'rams': 'Los Angeles Rams',
        'texans': 'Houston Texans', 'colts': 'Indianapolis Colts',
        'jags': 'Jacksonville Jaguars', 'titans': 'Tennessee Titans',
        'lakers': 'Los Angeles Lakers', 'celtics': 'Boston Celtics',
        'warriors': 'Golden State Warriors', 'dubs': 'Golden State Warriors',
        'nets': 'Brooklyn Nets', 'knicks': 'New York Knicks',
        'bulls': 'Chicago Bulls', 'heat': 'Miami Heat',

        'suns': 'Phoenix Suns', 'blazers': 'Portland Trail Blazers',
        'kings': 'Sacramento Kings', 'spurs': 'San Antonio Spurs',
        'jazz': 'Utah Jazz', 'wizards': 'Washington Wizards',
        'yanks': 'New York Yankees', 'yankees': 'New York Yankees',
        'sox': 'Boston Red Sox', 'dodgers': 'Los Angeles Dodgers',
        'cubs': 'Chicago Cubs', 'astros': 'Houston Astros',
        'braves': 'Atlanta Braves', 'mets': 'New York Mets',
        'phillies': 'Philadelphia Phillies', 'padres': 'San Diego Padres',
        'brewers': 'Milwaukee Brewers', 'reds': 'Cincinnati Reds',
        'pirates': 'Pittsburgh Pirates', 'tigers': 'Detroit Tigers',
        'twins': 'Minnesota Twins', 'guardians': 'Cleveland Guardians',
        'royals': 'Kansas City Royals', 'angels': 'Los Angeles Angels',
        'mariners': 'Seattle Mariners', 'rangers': 'Texas Rangers',
        'rays': 'Tampa Bay Rays', 'orioles': 'Baltimore Orioles',
        'jays': 'Toronto Blue Jays', 'nats': 'Washington Nationals',

        'flames': 'Calgary Flames', 'canes': 'Carolina Hurricanes',

        'wings': 'Detroit Red Wings', 'oilers': 'Edmonton Oilers',
        'habs': 'Montreal Canadiens', 'preds': 'Nashville Predators',
        'devils': 'New Jersey Devils', 'isles': 'New York Islanders',
        'sens': 'Ottawa Senators', 'flyers': 'Philadelphia Flyers',
        'pens': 'Pittsburgh Penguins', 'sharks': 'San Jose Sharks',
        'kraken': 'Seattle Kraken', 'blues': 'St. Louis Blues',
        'bolts': 'Tampa Bay Lightning', 'leafs': 'Toronto Maple Leafs',
        'ducks': 'Anaheim Ducks', 'canucks': 'Vancouver Canucks',
        'vgk': 'Vegas Golden Knights', 'caps': 'Washington Capitals',
        'dawgs': 'Georgia Bulldogs', 'bulldogs': 'Georgia Bulldogs',
        'tide': 'Alabama Crimson Tide', 'bama': 'Alabama Crimson Tide',
        'buckeyes': 'Ohio State Buckeyes', 'wolverines': 'Michigan Wolverines',
        'longhorns': 'Texas Longhorns', 'sooners': 'Oklahoma Sooners',
        'irish': 'Notre Dame Fighting Irish', 'lsu': 'LSU Tigers',
        'vols': 'Tennessee Volunteers', 'gators': 'Florida Gators',
        'aggies': 'Texas A&M Aggies', 'rebels': 'Ole Miss Rebels',
        'utes': 'Utah Utes', 'blue devils': 'Duke Blue Devils',
        'wildcats': 'Kentucky Wildcats', 'jayhawks': 'Kansas Jayhawks',
        'unc': 'North Carolina Tar Heels', 'zags': 'Gonzaga Bulldogs',
        'uconn': 'Connecticut Huskies', 'spartans': 'Michigan State Spartans',
        'razorbacks': 'Arkansas Razorbacks',
      };

      const TOP_N = 30;
      const collegeSports = ['ncaafb', 'ncaabb', 'ncaasb', 'ncaasoftball'];
      let allTeams = [];
      let savedPrefs = { sports: [], teams: [] };
      const loadedTeams = {};

      function buildTeamLabel(t) {
        const label = document.createElement('label');
        label.innerHTML = `
          <input type="checkbox" value="${t.name}" />
          <img src="${t.logo}" class="team-logo" alt="${t.name}" onerror="this.style.display='none'" />
          ${t.name}
        `;
        if (savedPrefs.teams?.includes(t.name)) {
          label.querySelector('input').checked = true;
        }
        return label;
      }

      function renderConferenceFilter(container, teams, containerId) {
        const conferences = ['All', ...new Set(teams.map(t => t.conference).filter(Boolean).sort())];
        const filterDiv = document.createElement('div');
        filterDiv.className = 'conference-filter';
        filterDiv.innerHTML = conferences.map(c =>
          `<button class="conf-btn ${c === 'All' ? 'active' : ''}" data-conf="${c}">${c}</button>`
        ).join('');
        container.appendChild(filterDiv);

        filterDiv.querySelectorAll('.conf-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            filterDiv.querySelectorAll('.conf-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const selected = btn.dataset.conf;
            const filtered = selected === 'All' ? teams : teams.filter(t => t.conference === selected);
            renderTeamList(container, filtered, filterDiv);
          });
        });
      }

      function renderTeamList(container, teams, filterEl) {
        // Remove everything except the filter
        Array.from(container.children).forEach(c => { if (c !== filterEl) c.remove(); });

        const top = teams.slice(0, TOP_N);
        const rest = teams.slice(TOP_N);

        top.forEach(t => container.appendChild(buildTeamLabel(t)));

        if (rest.length > 0) {
          const wrap = document.createElement('div');
          wrap.className = 'show-more-wrap';
          wrap.style.gridColumn = '1/-1';
          const btn = document.createElement('button');
          btn.className = 'show-more-btn';
          btn.textContent = `+ Show ${rest.length} more teams`;
          const extra = document.createElement('div');
          extra.className = 'extra-teams';
          rest.forEach(t => extra.appendChild(buildTeamLabel(t)));
          btn.addEventListener('click', () => {
            const hidden = extra.style.display !== 'grid';
            extra.style.display = hidden ? 'grid' : 'none';
            btn.textContent = hidden ? `− Hide extra teams` : `+ Show ${rest.length} more teams`;
          });
          wrap.appendChild(btn);
          wrap.appendChild(extra);
          container.appendChild(wrap);
        }
      }

      function buildSectionFor(sport, teams) {
        const meta = sportMeta[sport];
        const section = document.createElement('div');
        section.className = 'pref-section';
        section.id = `section-${sport}`;
        section.innerHTML = `<h4>${meta.emoji} ${meta.label}</h4>`;

        const grid = document.createElement('div');
        grid.className = 'checkbox-grid';
        grid.id = `${sport}-teams`;
        section.appendChild(grid);

        if (meta.college) {
          renderConferenceFilter(grid, teams, `${sport}-teams`);
          renderTeamList(grid, teams, grid.querySelector('.conference-filter'));
        } else {
          teams.forEach(t => grid.appendChild(buildTeamLabel(t)));
        }

        return section;
      }

      function updateSections() {
        const selectedSports = [...document.querySelectorAll('#sports-grid input:checked')].map(cb => cb.value);
        const favContainer = document.getElementById('favorite-sport-sections');
        const otherContent = document.getElementById('other-sports-content');
        const otherWrap = document.getElementById('other-sports-wrap');

        favContainer.innerHTML = '';
        otherContent.innerHTML = '';

        const otherSports = Object.keys(sportMeta).filter(s => !selectedSports.includes(s));

        selectedSports.forEach(sport => {
          if (loadedTeams[sport]) {
            favContainer.appendChild(buildSectionFor(sport, loadedTeams[sport]));
          }
        });

        if (otherSports.length > 0) {
          otherWrap.style.display = 'block';
          otherSports.forEach(sport => {
            if (loadedTeams[sport]) {
              otherContent.appendChild(buildSectionFor(sport, loadedTeams[sport]));
            }
          });
        } else {
          otherWrap.style.display = 'none';
        }
      }

      // Other sports toggle
      document.getElementById('other-sports-toggle').addEventListener('click', () => {
        const content = document.getElementById('other-sports-content');
        const arrow = document.getElementById('other-sports-arrow');
        const isHidden = content.style.display !== 'block';
        content.style.display = isHidden ? 'block' : 'none';
        arrow.textContent = isHidden ? '▲' : '▼';
      });

      // Update sections when sports checkboxes change
      document.getElementById('sports-grid').addEventListener('change', updateSections);

      // Search
      document.getElementById('team-search').addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();
        const resultsBox = document.getElementById('search-results');
        const searchGrid = document.getElementById('search-grid');

        if (!query) { resultsBox.style.display = 'none'; return; }

        const nicknameMatch = nicknames[query];
        const matches = allTeams.filter(t => {
          const fullName = t.name.toLowerCase();
          const abbr = (t.abbreviation || '').toLowerCase();
          return fullName.includes(query) || abbr === query || (nicknameMatch && t.name === nicknameMatch);
        });

        resultsBox.style.display = 'block';

        if (matches.length === 0) {
          searchGrid.innerHTML = '<p class="no-results">No teams found. Try a nickname like "Dawgs", "Tide", "Pens", or "Dubs".</p>';
          return;
        }

        searchGrid.innerHTML = matches.map(t => {
          const existing = document.querySelector(`input[value="${t.name}"]:not(.search-cb)`);
          const isChecked = existing ? existing.checked : false;
          const nickname = Object.entries(nicknames).find(([k, v]) => v === t.name)?.[0] ?? '';
          return `
            <label>
              <input type="checkbox" value="${t.name}" data-sport="${t.sport}" ${isChecked ? 'checked' : ''} class="search-cb" />
              <img src="${t.logo}" class="team-logo" alt="${t.name}" onerror="this.style.display='none'" />
              <span>
                ${t.name}
                ${nickname ? `<span class="team-nickname">(${nickname})</span>` : ''}
              </span>
              <span class="sport-tag">${t.sport}${t.conference ? ` · ${t.conference}` : ''}</span>
            </label>
          `;
        }).join('');

        document.querySelectorAll('.search-cb').forEach(cb => {
          cb.addEventListener('change', () => {
            const mainCb = document.querySelector(`input[value="${cb.value}"]:not(.search-cb)`);
            if (mainCb) mainCb.checked = cb.checked;
          });
        });
      });

      async function loadAllTeams() {
        await Promise.all(Object.keys(sportMeta).map(async sport => {
          try {
            const res = await fetch(`https://better-bookie-five.vercel.app/api/logos?sport=${sport}`);
            const teams = await res.json();
            loadedTeams[sport] = teams;
            teams.forEach(t => allTeams.push({ ...t, sport: sport.toUpperCase() }));
          } catch (e) {
            loadedTeams[sport] = [];
          }
        }));
        updateSections();
      }

      let currentUser = null;

      onAuthStateChanged(auth, async user => {
        if (!user) { window.location.href = 'login.html'; return; }
        currentUser = user;
        document.getElementById('welcome-msg').textContent = `Welcome, ${user.displayName || user.email}!`;
        document.getElementById('user-email').textContent = user.email;

        const docRef = doc(db, 'users', user.uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          savedPrefs = docSnap.data();
          if (savedPrefs.sports) {
            savedPrefs.sports.forEach(val => {
              const cb = document.querySelector(`#sports-grid input[value="${val}"]`);
              if (cb) cb.checked = true;
            });
          }
        }

        await loadAllTeams();
      });

      document.getElementById('save-btn').addEventListener('click', async () => {
        if (!currentUser) return;
        const sports = [...document.querySelectorAll('#sports-grid input:checked')].map(cb => cb.value);
        const teams = [...document.querySelectorAll('.pref-section input[type="checkbox"]:checked, .extra-teams input:checked')].map(cb => cb.value);
        await setDoc(doc(db, 'users', currentUser.uid), { sports, teams });
        const msg = document.getElementById('success-msg');
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 3000);
      });

      document.getElementById('signout-btn').addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = 'index.html';
      });
    </script>
  </body>
</html>
