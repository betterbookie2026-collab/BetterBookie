        padding: 1.5rem;

      .pref-section h4 {

        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.7;
        font-size: 0.8rem;
      }
      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 0.5rem;
      }
      .checkbox-grid label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .checkbox-grid input[type="checkbox"] {

        height: 16px;
        cursor: pointer;
      }
      .save-btn {

        background: #fff;
        color: #000;
        border: none;
        border-radius: 4px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 1rem;
      }
      .save-btn:hover {

      }
      .signout-btn {

        background: transparent;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 4px;
        color: inherit;
        cursor: pointer;
        font-size: 0.85rem;

      .success-msg {

    <script src="script.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC2sgfkqCVFU1RfiWsArIWjpvpebKVxT64",
        authDomain: "betterbookie.firebaseapp.com",
        projectId: "betterbookie",
        storageBucket: "betterbookie.firebasestorage.app",
        messagingSenderId: "995577929895",
        appId: "1:995577929895:web:303a93aa15628d6c503b82"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let currentUser = null;

      onAuthStateChanged(auth, async user => {
        if (!user) {
          window.location.href = 'login.html';
          return;
        }
        currentUser = user;
        document.getElementById('welcome-msg').textContent = `Welcome, ${user.displayName || user.email}!`;
        document.getElementById('user-email').textContent = user.email;

        // Load saved preferences
        const docRef = doc(db, 'users', user.uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const prefs = docSnap.data();
          if (prefs.sports) {
            prefs.sports.forEach(val => {
              const cb = document.querySelector(`input[value="${val}"]`);
              if (cb) cb.checked = true;
            });
          }
          if (prefs.teams) {
            prefs.teams.forEach(val => {
              const cb = document.querySelector(`input[value="${val}"]`);
              if (cb) cb.checked = true;
            });
          }
        }
      });

      document.getElementById('save-btn').addEventListener('click', async () => {
        if (!currentUser) return;

        const sports = [...document.querySelectorAll('.pref-section:first-of-type input:checked')].map(cb => cb.value);
        const teams = [...document.querySelectorAll('.pref-section:not(:first-of-type) input:checked')].map(cb => cb.value);

        await setDoc(doc(db, 'users', currentUser.uid), { sports, teams });

        const msg = document.getElementById('success-msg');
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 3000);
      });

      document.getElementById('signout-btn').addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = 'index.html';
      });
    </script>
