    <title>Live Odds – BetterBookie</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .odds-nav {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin: 2rem 0 1rem;
      }
      .odds-nav button {
        padding: 0.5rem 1.25rem;
        border: 2px solid currentColor;
        background: transparent;
        cursor: pointer;
        font-size: 0.95rem;
        border-radius: 4px;
      }
      .odds-nav button.active { background: #fff; color: #000; }
      .odds-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
        padding: 1.5rem 2rem;
      }
      .odds-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        padding: 1.25rem;
      }
      .odds-card h4 { margin: 0 0 0.75rem; font-size: 1rem; }
      .odds-card p { margin: 0.25rem 0; font-size: 0.9rem; opacity: 0.8; }
      .team-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.4rem 0; font-size: 0.9rem; }
      .team-logo { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
      .odds-table-wrap { padding: 1rem 2rem 3rem; overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      th, td { text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
      th { opacity: 0.6; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
      .loading { text-align: center; padding: 3rem; opacity: 0.6; }
      .sport-label {
        display: inline-block;
        font-size: 0.7rem;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        background: rgba(255,255,255,0.15);
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .td-team { display: flex; align-items: center; gap: 0.4rem; }
      .td-logo { width: 20px; height: 20px; object-fit: contain; }
    </style>
  </head>

      <div class="hero-content">

    </header>

    <section class="features">

      function getLogo(name) { return teamLogos[name] ?? ''; }
      function logoImg(name, size = 24) {
        const src = getLogo(name);
        return src ? `<img src="${src}" style="width:${size}px;height:${size}px;object-fit:contain;" alt="${name}" onerror="this.style.display='none'" />` : '';
      }

      let currentSport = 'americanfootball_nfl';

      async function fetchOdds(sport) {
        const cardsContainer = document.getElementById('cards-container');
        const tableBody = document.getElementById('odds-table-body');
        cardsContainer.innerHTML = '<div class="loading">Loading odds...</div>';
        tableBody.innerHTML = '<tr><td colspan="5" class="loading">Loading odds...</td></tr>';
        try {
          const res = await fetch(`https://better-bookie-five.vercel.app/api/odds?sport=${sport}`);
          const data = await res.json();
          if (!Array.isArray(data) || data.length === 0) {
            cardsContainer.innerHTML = '<div class="loading">No games found right now.</div>';
            tableBody.innerHTML = '<tr><td colspan="5" class="loading">No games found.</td></tr>';
            return;
          }
          const sportLabel = sport.includes('nfl') ? 'NFL' : sport.includes('nba') ? 'NBA' : 'MLB';
          cardsContainer.innerHTML = data.slice(0, 6).map(game => {
            const home = game.home_team;
            const away = game.away_team;
            const bookmaker = game.bookmakers?.[0];
            const market = bookmaker?.markets?.find(m => m.key === 'h2h');
            const homeOdds = market?.outcomes?.find(o => o.name === home)?.price ?? 'N/A';
            const awayOdds = market?.outcomes?.find(o => o.name === away)?.price ?? 'N/A';
            const date = new Date(game.commence_time).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            return `
              <div class="odds-card">
                <span class="sport-label">${sportLabel}</span>
                <h4>${logoImg(home)} ${home} vs ${logoImg(away)} ${away}</h4>
                <p>📅 ${date}</p>
                <div class="team-row">${logoImg(home)} <span>${home}: <strong>${homeOdds > 0 ? '+' : ''}${homeOdds}</strong></span></div>
                <div class="team-row">${logoImg(away)} <span>${away}: <strong>${awayOdds > 0 ? '+' : ''}${awayOdds}</strong></span></div>
                <p style="opacity:0.5;font-size:0.8rem;margin-top:0.5rem;">via ${bookmaker?.title ?? 'N/A'}</p>
              </div>
            `;
          }).join('');
          tableBody.innerHTML = data.map(game => {
            const home = game.home_team;
            const away = game.away_team;
            const bookmaker = game.bookmakers?.[0];
            const market = bookmaker?.markets?.find(m => m.key === 'h2h');
            const homeOdds = market?.outcomes?.find(o => o.name === home)?.price ?? 'N/A';
            const awayOdds = market?.outcomes?.find(o => o.name === away)?.price ?? 'N/A';
            const date = new Date(game.commence_time).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            return `
              <tr>
                <td><div class="td-team">${logoImg(home, 20)} ${home}</div></td>
                <td><div class="td-team">${logoImg(away, 20)} ${away}</div></td>
                <td>${homeOdds > 0 ? '+' : ''}${homeOdds}</td>
                <td>${awayOdds > 0 ? '+' : ''}${awayOdds}</td>
                <td>${date}</td>
              </tr>
            `;
          }).join('');
        } catch (err) {
          cardsContainer.innerHTML = '<div class="loading">Failed to load odds. Please try again.</div>';
          tableBody.innerHTML = '<tr><td colspan="5" class="loading">Failed to load odds.</td></tr>';
        }
      }

      document.querySelectorAll('.odds-nav button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.odds-nav button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentSport = btn.dataset.sport;
          fetchOdds(currentSport);
        });
      });

      fetchOdds(currentSport);
