<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Odds – BetterBookie</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .odds-nav {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin: 2rem 0 1rem;
      }
      .odds-nav button {
        padding: 0.5rem 1.25rem;
        border: 2px solid currentColor;
        background: transparent;
        cursor: pointer;
        font-size: 0.95rem;
        border-radius: 4px;
      }
      .odds-nav button.active {
        background: #fff;
        color: #000;
      }
      .odds-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
        padding: 1.5rem 2rem;
      }
      .odds-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        padding: 1.25rem;
      }
      .odds-card h4 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      .odds-card p {
        margin: 0.25rem 0;
        font-size: 0.9rem;
        opacity: 0.8;
      }
      .odds-table-wrap {
        padding: 1rem 2rem 3rem;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th, td {
        text-align: left;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      th {
        opacity: 0.6;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
      }
      .loading {
        text-align: center;
        padding: 3rem;
        opacity: 0.6;
      }
      .sport-label {
        display: inline-block;
        font-size: 0.7rem;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        background: rgba(255,255,255,0.15);
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <nav class="nav">
        <h1 class="logo"><a href="index.html" style="text-decoration:none;color:inherit;">BetterBookie</a></h1>
        <button
          class="menu-toggle"
          id="menu-toggle"
          type="button"
          aria-label="Toggle menu"
          aria-expanded="false"
        >
          ☰
        </button>
        <div class="nav-links" id="nav-links">
          <a href="index.html#features">Features</a>
          <a href="scores.html">Scores</a>
          <a href="odds.html">Live Odds</a>
          <a href="injuries.html">Injuries</a>
          <a href="login.html">Login</a>
          <a href="index.html#signup" class="btn btn-small">Get Started</a>
        </div>
      </nav>
      <div class="hero-content">
        <h2>Live Odds</h2>
        <p>Real-time odds across NFL, NBA, and MLB — updated live.</p>
      </div>
    </header>

    <section class="features">
      <div class="odds-nav">
        <button class="active" data-sport="americanfootball_nfl">NFL</button>
        <button data-sport="basketball_nba">NBA</button>
        <button data-sport="baseball_mlb">MLB</button>
      </div>

      <div id="cards-container" class="odds-cards">
        <div class="loading">Loading odds...</div>
      </div>

      <div class="odds-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Sport</th>
              <th>Home Team</th>
              <th>Away Team</th>
              <th>Home Odds</th>
              <th>Away Odds</th>
              <th>Commence Time</th>
            </tr>
          </thead>
          <tbody id="odds-table-body">
            <tr><td colspan="6" class="loading">Loading odds...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer class="footer">
      <p>&copy; 2026 BetterBookie. Built by a beginner.</p>
    </footer>

    <script src="script.js"></script>
    <script>
      let currentSport = 'americanfootball_nfl';

      async function fetchOdds(sport) {
        const cardsContainer = document.getElementById('cards-container');
        const tableBody = document.getElementById('odds-table-body');
        cardsContainer.innerHTML = '<div class="loading">Loading odds...</div>';
        tableBody.innerHTML = '<tr><td colspan="6" class="loading">Loading odds...</td></tr>';

        try {
          const res = await fetch(`https://better-bookie-five.vercel.app/api/odds?sport=${sport}`);
          const data = await res.json();

          if (!Array.isArray(data) || data.length === 0) {
            cardsContainer.innerHTML = '<div class="loading">No games found right now.</div>';
            tableBody.innerHTML = '<tr><td colspan="6" class="loading">No games found.</td></tr>';
            return;
          }

          const sportLabel = sport.includes('nfl') ? 'NFL' : sport.includes('nba') ? 'NBA' : 'MLB';

          cardsContainer.innerHTML = data.slice(0, 6).map(game => {
            const home = game.home_team;
            const away = game.away_team;
            const bookmaker = game.bookmakers?.[0];
            const market = bookmaker?.markets?.find(m => m.key === 'h2h');
            const homeOdds = market?.outcomes?.find(o => o.name === home)?.price ?? 'N/A';
            const awayOdds = market?.outcomes?.find(o => o.name === away)?.price ?? 'N/A';
            const date = new Date(game.commence_time).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            return `
              <div class="odds-card">
                <span class="sport-label">${sportLabel}</span>
                <h4>${home} vs ${away}</h4>
                <p>📅 ${date}</p>
                <p>🏠 ${home}: <strong>${homeOdds > 0 ? '+' : ''}${homeOdds}</strong></p>
                <p>✈️ ${away}: <strong>${awayOdds > 0 ? '+' : ''}${awayOdds}</strong></p>
                <p style="opacity:0.5;font-size:0.8rem;">via ${bookmaker?.title ?? 'N/A'}</p>
              </div>
            `;
          }).join('');

          tableBody.innerHTML = data.map(game => {
            const home = game.home_team;
            const away = game.away_team;
            const bookmaker = game.bookmakers?.[0];
            const market = bookmaker?.markets?.find(m => m.key === 'h2h');
            const homeOdds = market?.outcomes?.find(o => o.name === home)?.price ?? 'N/A';
            const awayOdds = market?.outcomes?.find(o => o.name === away)?.price ?? 'N/A';
            const date = new Date(game.commence_time).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            return `
              <tr>
                <td>${sportLabel}</td>
                <td>${home}</td>
                <td>${away}</td>
                <td>${homeOdds > 0 ? '+' : ''}${homeOdds}</td>
                <td>${awayOdds > 0 ? '+' : ''}${awayOdds}</td>
                <td>${date}</td>
              </tr>
            `;
          }).join('');

        } catch (err) {
          cardsContainer.innerHTML = '<div class="loading">Failed to load odds. Please try again.</div>';
          tableBody.innerHTML = '<tr><td colspan="6" class="loading">Failed to load odds.</td></tr>';
        }
      }

      document.querySelectorAll('.odds-nav button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.odds-nav button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentSport = btn.dataset.sport;
          fetchOdds(currentSport);
        });
      });

      fetchOdds(currentSport);
    </script>
  </body>
</html>
