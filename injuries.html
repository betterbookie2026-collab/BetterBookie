<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Injuries – BetterBookie</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .odds-nav {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin: 2rem 0 1rem;
        flex-wrap: wrap;
      }
      .odds-nav button {
        padding: 0.5rem 1.25rem;
        border: 2px solid currentColor;
        background: transparent;
        cursor: pointer;
        font-size: 0.95rem;
        border-radius: 4px;
      }
      .odds-nav button.active {
        background: #fff;
        color: #000;
      }
      .team-select-wrap {
        display: flex;
        justify-content: center;
        margin: 0 0 1.5rem;
      }
      .team-select-wrap select {
        padding: 0.5rem 1rem;
        font-size: 0.95rem;
        border-radius: 4px;
        border: 2px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .odds-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
        padding: 1.5rem 2rem;
      }
      .odds-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        padding: 1.25rem;
      }
      .odds-card h4 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      .odds-card p {
        margin: 0.25rem 0;
        font-size: 0.9rem;
        opacity: 0.8;
      }
      .odds-table-wrap {
        padding: 1rem 2rem 3rem;
        overflow-x: auto;
      }

        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th, td {
        text-align: left;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
